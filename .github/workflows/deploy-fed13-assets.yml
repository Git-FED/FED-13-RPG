name: Deploy FED-13 game art

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-art:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download and deploy game art
        run: |
          set -euo pipefail
          ZIP_URL="https://muse.ai/files/1262794840260867/991706460213252/a7b6zqoj4ysn170g74o0quap/fed-13-game-assets.zip"
          curl -sSL -o "$RUNNER_TEMP/fed13-assets.zip" "$ZIP_URL"
          unzip -t "$RUNNER_TEMP/fed13-assets.zip"
          before=$(find assets -maxdepth 1 -name '*.png' | wc -l)
          unzip -o "$RUNNER_TEMP/fed13-assets.zip" -d assets/
          after=$(find assets -maxdepth 1 -name '*.png' | wc -l)
          added=$((after - before))
          echo "PNGs in assets/ before: $before, after: $after, added: $added"
          if [ "$added" -lt 173 ]; then
            echo "ERROR: expected at least 173 new PNGs, got $added"
            exit 1
          fi
          for f in ov3_title_bg.png cover_figure.png tile_ground.png; do
            if [ ! -f "assets/$f" ]; then
              echo "ERROR: missing assets/$f"
              exit 1
            fi
          done
          if git status --porcelain | grep -q '^ M'; then
            echo "ERROR: an existing tracked file was modified"
            git status --porcelain
            exit 1
          fi
          rm .github/workflows/deploy-fed13-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "FED-13: upload game art assets (173 PNGs)"
          git push origin main
