<!DOCTYPE html>
<!-- FED-13 build version 4.0.0-overhaul -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preload" as="image" href="assets/ov3_title_bg.png?v=4">
<title>FED-13</title>
<style>
  html, body { margin: 0; padding: 0; background: #0a0a14; }
  body { font-family: monospace; color: #c8c8e8; text-align: center; }
  #fed13-ds { background: #101018; padding: 12px 8px 16px; max-width: 560px; margin: 0 auto; }
  #fed13-ds h1 { color: #f8f0c8; font-size: 18px; margin: 4px 0 10px; letter-spacing: 2px; }
  canvas { display: inline-block; background: #000; border: 2px solid #222244; image-rendering: pixelated; width: 512px; height: 384px; max-width: 100%; }
  #fed13-controls { margin-top: 10px; user-select: none; background-image: url("assets/ov4_controls_bar.png?v=4"); background-repeat: no-repeat; background-position: center center; background-size: 512px 96px; padding: 23px 0; }
  #fed13-controls button { width: 52px; height: 44px; margin: 3px; font-size: 14px; font-family: monospace; cursor: pointer; background: transparent; color: transparent; border: none; box-shadow: none; border-radius: 6px; background-repeat: no-repeat; background-position: center center; background-size: contain; }
  #fed13-controls button.btn-dpad { background-image: url("assets/ov4_dpad.png?v=4"); }
  #fed13-controls button.btn-dpad:nth-of-type(1) { background-size: 136.26px 136.26px; background-position: -42.13px 0; }
  #fed13-controls button.btn-dpad:nth-of-type(2) { background-size: 120.69px 120.69px; background-position: 7.14px -38.97px; }
  #fed13-controls button.btn-dpad:nth-of-type(3) { background-size: 136.26px 136.26px; background-position: -42.13px -92.97px; }
  #fed13-controls button.btn-dpad:nth-of-type(4) { background-size: 120.69px 120.69px; background-position: -75.83px -38.97px; }
  #fed13-controls button.btn-a { background-image: url("assets/ov4_btn_a.png?v=4"); }
  #fed13-controls button.btn-b { background-image: url("assets/ov4_btn_b.png?v=4"); }
  #fed13-controls button.btn-x { background-image: url("assets/ov4_btn_x.png?v=4"); }
  #fed13-controls button.btn-start { background-image: url("assets/ov4_btn_start.png?v=4"); }
  #fed13-controls button.wide { width: 64px; }
  #fed13-hint { font-size: 11px; color: #8888aa; margin-top: 8px; }
</style>
</head>
<body>
<div id="fed13-ds">
  <h1>FED-13</h1>
  <canvas id="topScreen" width="256" height="192"></canvas><br>
  <canvas id="bottomScreen" width="256" height="192"></canvas>
  <div id="fed13-controls">
    <button type="button" class="btn-dpad" onclick="window.FED13 &amp;&amp; window.FED13.press('up')">UP</button>
    <button type="button" class="btn-dpad" onclick="window.FED13 &amp;&amp; window.FED13.press('left')">LEFT</button>
    <button type="button" class="btn-dpad" onclick="window.FED13 &amp;&amp; window.FED13.press('down')">DOWN</button>
    <button type="button" class="btn-dpad" onclick="window.FED13 &amp;&amp; window.FED13.press('right')">RIGHT</button>
    <button type="button" class="btn-a" onclick="window.FED13 &amp;&amp; window.FED13.press('confirm')">A</button>
    <button type="button" class="btn-b" onclick="window.FED13 &amp;&amp; window.FED13.press('cancel')">B</button>
    <button type="button" class="btn-x" onclick="window.FED13 &amp;&amp; window.FED13.press('menu')">X</button>
    <button type="button" class="wide btn-start" onclick="window.FED13 &amp;&amp; window.FED13.press('start')">START</button>
  </div>
  <div id="fed13-hint">Keyboard: arrows or WASD move, Z or Enter confirms, B cancels, X opens the menu, Space is Start.</div>
</div>
<script src="code/engine.js"></script>
<script src="code/story.js"></script>
<script src="code/overworld.js"></script>
<script src="code/battle1v1.js"></script>
<script src="code/grid.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    if (window.FED13 && typeof window.FED13.init === 'function') { window.FED13.init(); }
  });
</script>
</body>
</html>
